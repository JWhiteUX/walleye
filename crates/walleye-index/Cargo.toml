[package]
name = "walleye-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Parquet index writer, DuckDB query service and filter language for Walleye"

[dependencies]
walleye-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `bundled` compiles DuckDB from source (no system lib, no download at runtime);
# `parquet` statically links the Parquet extension so nothing is ever fetched.
duckdb = { version = "1.20000.1", features = ["bundled", "parquet"] }
base64 = "0.22"

[dev-dependencies]
proptest = "1"

[[bench]]
name = "queries"
harness = false

[lints]
workspace = true
