# cargo-fuzz workspace for Walleye. Separate from the main workspace (it needs
# nightly and sanitizer flags); the root Cargo.toml lists it under `exclude`.
#
#   rustup run nightly cargo fuzz list
#   fuzz/run_all.sh 60                          # every target that builds today
#   FEATURES="ingest index" fuzz/run_all.sh 600 # after integration
#
# Targets against crates that are still being built are gated by the
# `ingest` / `index` features (PENDING.md lists the exact functions needed).
[package]
name = "walleye-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[features]
default = []
# walleye-ingest fuzz entry points (Agent A).
ingest = ["dep:walleye-ingest"]
# walleye-index filter parser/compiler (Agent B).
index = ["dep:walleye-index"]

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walleye-core = { path = "../crates/walleye-core" }
walleye-ingest = { path = "../crates/walleye-ingest", optional = true }
walleye-index = { path = "../crates/walleye-index", optional = true }

[profile.release]
debug = 1

# ---- buildable now (walleye-core) ------------------------------------------

