# Known-good destinations. Matching IOCs are kept but flagged `allowlisted`,
# and detectors down-weight reasons whose destination matches.
# Schema: crates/walleye-core/src/allowlist.rs. Owner: Agent F (defaults may grow).
#
# Policy (keep it conservative):
# * `suffix` matches the name itself and its subdomains on a label boundary
#   (`windowsupdate.com` matches `a.windowsupdate.com`, never
#   `evilwindowsupdate.com`).
# * Only hosts run by the vendor for OS/software updates, OS telemetry,
#   time and connectivity checks. No general cloud or hosting namespaces where anyone
#   can get a subdomain (azurewebsites.net, herokuapp.com, appspot.com,
#   blob.core.windows.net, ...): attackers host C2 there.
# * CDN edge names below are CNAME targets of the CDN itself. Multi-tenant
#   CDNs can still carry attacker content (domain fronting), which is why
#   allowlisted IOCs are flagged, never dropped. cloudfront.net and fastly.net
#   are deliberately absent: anyone can create a distribution there (*.cloudfront.net
#   names are customer-chosen), and both are documented C2 front ends.
# * CIDRs only where the vendor owns the whole block or for single,
#   well-known resolver addresses. No cloud-provider ranges.
# * JA4 is empty on purpose: common client fingerprints are shared by malware
#   built on the same TLS stacks.
version: 1
domains:
  # Microsoft / Windows Update
  - { suffix: windowsupdate.com, reason: "Microsoft Update" }
  - { suffix: update.microsoft.com, reason: "Microsoft Update" }
  - { suffix: windowsupdate.microsoft.com, reason: "Microsoft Update" }
  - { suffix: delivery.mp.microsoft.com, reason: "Microsoft Update delivery" }
  - { suffix: wustat.windows.com, reason: "Microsoft Update" }
