  - { suffix: msftconnecttest.com, reason: "Windows connectivity check" }
  - { suffix: msftncsi.com, reason: "Windows connectivity check" }
  - { suffix: time.windows.com, reason: "Windows time service" }
  - { suffix: events.data.microsoft.com, reason: "Windows telemetry (Connected User Experiences)" }
  - { suffix: vortex.data.microsoft.com, reason: "Windows telemetry" }
  - { suffix: settings-win.data.microsoft.com, reason: "Windows telemetry settings" }
  - { suffix: watson.telemetry.microsoft.com, reason: "Windows Error Reporting" }
  - { suffix: watson.microsoft.com, reason: "Windows Error Reporting" }
