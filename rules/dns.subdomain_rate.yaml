# Many never-repeated subdomains of one domain per minute.
id: dns.subdomain_rate
title: "Rapid unique subdomains of {domain}"
detector: dns_subdomain_rate
attack_technique: T1071.004
params:
  min_unique: 20
  min_span_s: 60        # floor for the time span, so a short burst is not divided by ~0
  rate_low: 1           # unique subdomains per minute for 0 points
  rate_high: 10
  ratio_low: 0.5        # unique / total queries for 0 points (scaled by the rate strength)
  ratio_high: 0.95
  allowlist_factor: 0.25
  prevalence_min_hosts: 3 # domain queried by >= max(3, 30% of internal hosts): shared service, score reduced
  prevalence_ratio: 0.3
  prevalence_factor: 0.3
weights:
  unique_rate: 20
  unique_ratio: 10
min_score: 12
explanation: "{src} queried {unique} unique subdomains of {domain} in {span_min} min ({rate_per_min}/min, {unique_pct}% never repeated) [{breakdown}]"
