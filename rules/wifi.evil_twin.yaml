# Evil twin (CONTRACTS §11.3): one SSID advertised by an open/OWE/WEP BSSID
# and by a WPA/WPA2/WPA3 BSSID. Clients that remember the network may join
# the weaker one, which can then intercept their traffic. Mesh and multi-band
# networks advertise the same security on every BSSID and never fire; hidden
# SSIDs and factory-default names (two neighbours' "linksys") are skipped.
# {ssid} arrives already quoted (walleye_core::text::quote_ssid); {channel}
# names the band too, since channel numbers repeat across 2.4/5/6 GHz.
id: wifi.evil_twin
title: "Possible evil twin of {ssid} from {bssid}"
detector: wifi_evil_twin
attack_technique: T1557
params:
  min_frames: 3       # beacons/probe responses per BSSID (one corrupt frame never fires)
  later_min_s: 60     # the weaker BSSID first seen this long after the original
  ignore_ssids: [default, linksys, netgear, dlink, tp-link, wireless, setup, android, iphone]
  max_findings: 200    # strongest devices reported; the top one notes how many more were dropped
weights:
  security_mismatch: 40
  randomized: 20
  other_channel: 15
  appeared_later: 15
  oui_mismatch: 10
min_score: 40
explanation: "{bssid} advertises {ssid} as {security} on {channel}, while {original_bssid} advertises it as {original_security} on {original_channel} ({originals} protected BSSID(s)); the weaker one appeared {delay_s}s after the original, {frames} frames [{breakdown}]"
